<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsRadar</title>
<script>
  // Send a reader to their own language if we have it, English otherwise.
  (function () {
    var want = (navigator.languages || [navigator.language || "en"])
      .map(function (l) { return String(l).slice(0, 2).toLowerCase(); });
    var have = ["en", "tr", "de"];
    var pick = "en";
    for (var i = 0; i < want.length; i++) {
      if (have.indexOf(want[i]) !== -1) { pick = want[i]; break; }
    }
    location.replace(pick + "/index.html");
  })();
</script>
<meta http-equiv="refresh" content="0; url=en/index.html">
